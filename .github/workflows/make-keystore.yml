# One-off helper, run by hand from the Actions tab.
#
# It makes the signing key, hands it back once as an artifact, and then has
# nothing more to do with it. The password is typed into the dispatch box and
# is never written down here: GitHub masks it in the log, and the only copies
# that persist are the ones you make.
#
#   1. Actions -> Create signing keystore -> Run workflow, and pick a password.
#   2. Download the artifact. It holds ipterebi.jks and the same file base64.
#   3. Put the base64 in a repository secret called KEYSTORE_BASE64, and the
#      password in one called KEYSTORE_PASSWORD.
#   4. Delete the artifact, and keep ipterebi.jks somewhere you will still
#      have it in five years.
#
# **Losing this key is not recoverable.** Android identifies an app by its
# signature, so an update signed with a different key is not an update -- it
# is a different app that cannot replace the first. Back it up somewhere that
# is not this laptop.
name: Create signing keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for the keystore (make one up, then keep it safe)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore ipterebi.jks \
            -alias ipterebi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=IPTerebi, OU=None, O=None, L=None, S=None, C=GB"
          base64 -w0 ipterebi.jks > keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-PRIVATE
          path: |
            ipterebi.jks
            keystore-base64.txt
