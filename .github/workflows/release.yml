# Cutting a TV release: push a tag.
#
#   git tag -a tv-v0.2.0 -m "..." && git push origin tv-v0.2.0
#
# This builds it, signs it with the owner's key, checks the signature really
# is theirs, and attaches the APK to a GitHub Release named after the tag.
# Nothing here is manual, deliberately: a release assembled by hand is one
# whose provenance is whatever the person who assembled it remembers.
#
# The version comes from the tag, both halves of it -- see versionCode in
# app/build.gradle.kts, which refuses a tag it cannot parse rather than
# falling back to 1.
name: Release

on:
  push:
    tags: [ 'tv-v*' ]

# To create the release and upload the APK to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ipterebi
      # Both the name and the code are read from this; see build.gradle.kts.
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      # **A release not signed with the owner's key must not exist.** The
      # ordinary build falls back to the debug key on purpose, so a fork can
      # still check R8 -- that reasoning does not extend to something people
      # install. An APK signed with the debug key can never be replaced by one
      # signed properly, so publishing it once would poison the name.
      - name: Refuse to release without the signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD must both be set to cut a release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: tools` is the action's default and that package no longer
      # exists in the SDK repository, so the default fails the job. The runner
      # image already carries what this app needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # No Gradle wrapper in this repository, deliberately -- the version
      # lives here, where it is visible.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # First, because it needs no SDK and it is where the panel quirks are
      # pinned. Nothing should be published over a red test.
      - name: Test the panel client
        run: gradle :core:test --no-daemon

      # Into the runner's temporary directory, never the workspace, which is
      # what gets uploaded.
      - name: Restore signing keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ipterebi.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ipterebi.jks" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build the release APK
        run: gradle assembleRelease --no-daemon

      # **Checked rather than assumed.** The signing block falls back to the
      # debug key when KEYSTORE_PATH is unset, and a typo in the step above
      # would do exactly that -- silently, with a green build and an APK that
      # looks fine until nobody can update it. So the certificate is read back
      # out of the APK that is about to be published.
      - name: Check it is signed with the owner's key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::This APK is signed with the debug key. Refusing to publish it."
            exit 1
          fi
          if ! echo "$CERTS" | grep -q "CN=IPTerebi"; then
            echo "::error::Unexpected signing certificate. Refusing to publish it."
            exit 1
          fi

      # Named after the tag, because a folder of files all called
      # app-release.apk is a folder nobody can tell apart.
      - name: Name it after the tag
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/ipterebi-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "IPTerebi TV ${GITHUB_REF_NAME#tv-v}" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" \
            "release/ipterebi-${GITHUB_REF_NAME}.apk"
