name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: tools` is the action's default and that package was removed
      # from the SDK repository, so the default fails the job before anything
      # is built: "Failed to find package 'tools'". The runner image already
      # carries platform-tools and the platforms and build-tools this app
      # needs, so nothing has to be installed here at all.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # There is no Gradle wrapper in this repository, deliberately — the
      # version lives here instead, where it is visible.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runs first because it needs no Android SDK and it is where the panel
      # quirks are pinned down. A failure here is a real regression; a failure
      # in the build below is usually a dependency problem.
      - name: Test the panel client
        run: gradle :core:test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ipterebi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
