name: Build APK

on:
  push:
    # The TV branch is built too. It shares core/ and most of app/ with main
    # and has its own screens on top, so it can be broken by a change that
    # leaves main perfectly green — which has happened twice.
    branches: [ main, tv ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: tools` is the action's default and that package was removed
      # from the SDK repository, so the default fails the job before anything
      # is built: "Failed to find package 'tools'". The runner image already
      # carries platform-tools and the platforms and build-tools this app
      # needs, so nothing has to be installed here at all.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # There is no Gradle wrapper in this repository, deliberately — the
      # version lives here instead, where it is visible.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runs first because it needs no Android SDK and it is where the panel
      # quirks are pinned down. A failure here is a real regression; a failure
      # in the build below is usually a dependency problem.
      - name: Test the panel client
        run: gradle :core:test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ipterebi-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # What this change does to the TV branch, before it lands rather than after.
  #
  # main and tv share core/ and nearly all of app/, and tv adds its own screens
  # that main knows nothing about. So a change can be green here and break the
  # box: it happened when `refreshIfStale` started taking channels instead of
  # their guide ids — the phone's caller passes nothing and picks them up
  # inside, so main never noticed, and the TV's caller, which passes ids, only
  # failed when it was built by hand afterwards.
  tv:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # The whole history, because this job merges branches.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge this change into the TV branch
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git fetch origin tv:tv
          # The change as it will be on main — for a pull request that is the
          # merge commit this job was given — put on top of tv.
          merged="$GITHUB_SHA"
          git checkout tv
          if git merge --no-edit "$merged"; then
            exit 0
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          echo "Conflicts:"; echo "$conflicts"
          # Conflicts in the fake panel are routine: both branches add their own
          # test channels to the same lines, and every merge so far has wanted
          # both. Nothing under tools/ is compiled, so the build below still
          # says what it needs to say — take the TV side and carry on.
          if echo "$conflicts" | grep -qvE '^tools/'; then
            echo "::error::This change conflicts with the TV branch in code, not just in tooling. Merge it by hand before landing."
            exit 1
          fi
          echo "::warning::Conflicts in tools/ only; taking the TV branch's side so the rest can be built."
          echo "$conflicts" | xargs -r git checkout --ours --
          echo "$conflicts" | xargs -r git add --

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the TV app with this change in it
        run: gradle assembleDebug --no-daemon
