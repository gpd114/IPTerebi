name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # There is no Gradle wrapper in this repository, deliberately — the
      # version lives here instead, where it is visible.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Runs first because it needs no Android SDK and it is where the panel
      # quirks are pinned down. A failure here is a real regression; a failure
      # in the build below is usually a dependency problem.
      - name: Test the panel client
        run: gradle :core:test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ipterebi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
